name: open-dla-bid-core
services:
  app:
    build: .
    init: true
    restart: unless-stopped
    # Default: this machine only. Set BIND to an internal address only if your IT policy allows other machines.
    ports: ["${BIND:-127.0.0.1}:${PORT:-3000}:3000"]
    environment: [ADMIN_PASSWORD]
    volumes: [data:/app/backend/data]
volumes:
  data:
